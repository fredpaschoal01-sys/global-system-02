name: Importar dados PGFN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar base oficial PGFN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UF_FILTER: ${{ vars.UF_FILTER }}
          MAX_ROWS: ${{ vars.MAX_ROWS }}
          PGFN_ARQUIVO: ${{ vars.PGFN_ARQUIVO }}
        run: python scripts/import_pgfn.py
