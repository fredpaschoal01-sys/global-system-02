name: Enriquecer CNPJ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar dados públicos de CNPJ
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENRICH_MAX: ${{ vars.ENRICH_MAX }}
          INCLUIR_SOCIOS: ${{ vars.INCLUIR_SOCIOS }}
        run: python scripts/enriquecer_cnpj.py
