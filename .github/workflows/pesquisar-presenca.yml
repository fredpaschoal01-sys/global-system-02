name: Pesquisar presença online

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pesquisar sites e redes das empresas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PESQUISA_MAX: ${{ vars.PESQUISA_MAX }}
        run: python scripts/pesquisar_presenca.py
